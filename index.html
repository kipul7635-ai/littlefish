<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#8fd8fb">
<title>little fish, little life</title>
<style>
  :root {
    --ink: #124866;
    --ink-soft: #477d99;
    --blue: #27a8e0;
    --blue-dark: #0879b5;
    --gloss: linear-gradient(180deg, rgba(255,255,255,.9), rgba(255,255,255,.16) 52%, rgba(255,255,255,0));
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    overflow: hidden;
    display: grid;
    place-items: center;
    padding: 22px;
    color: var(--ink);
    font-family: "Nunito Sans", "Segoe UI", "Frutiger", "Trebuchet MS", sans-serif;
    background: linear-gradient(180deg, #4db8f2 0%, #8fd8fb 38%, #d6f3ff 72%, #e9fbff 100%);
  }
  .sky { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
  .sun {
    position: absolute; width: 95vmax; height: 95vmax; top: -56vmax; left: 50%;
    transform: translateX(-50%);
    background: radial-gradient(circle, rgba(255,255,255,.9), rgba(255,255,255,.3) 25%, transparent 60%);
  }
  .cloud {
    position: absolute; width: 300px; height: 120px; filter: blur(5px); opacity: .8;
    background:
      radial-gradient(70px 42px at 26% 62%, #fff 55%, transparent 100%),
      radial-gradient(80px 58px at 50% 44%, #fff 55%, transparent 100%),
      radial-gradient(64px 40px at 76% 64%, #fff 55%, transparent 100%);
  }
  .c1 { top: 9vh; left: -70px; }
  .c2 { top: 24vh; right: -100px; transform: scale(1.25); opacity: .65; }
  .c3 { top: 48vh; left: 3vw; transform: scale(.75); opacity: .55; }
  .hill {
    position: absolute; bottom: -25vh; width: 95vw; height: 43vh; border-radius: 50%;
    background: linear-gradient(180deg, #b5f283 0%, #4fc25a 48%, #1f8f3e 100%);
    box-shadow: inset 0 14px 30px rgba(255,255,255,.45);
  }
  .h1 { left: -30vw; }
  .h2 { right: -35vw; bottom: -28vh; background: linear-gradient(180deg, #8de86a, #36b24d 52%, #1a8238); }
  .bubble {
    position: absolute; bottom: -70px; left: var(--x); width: var(--s); height: var(--s);
    border-radius: 50%; border: 1px solid rgba(255,255,255,.85);
    background: radial-gradient(circle at 30% 28%, rgba(255,255,255,.95) 0 10%, transparent 27%),
      radial-gradient(circle at 50% 50%, rgba(255,255,255,.08) 55%, rgba(120,215,255,.35) 100%);
    box-shadow: inset 0 -8px 14px rgba(255,255,255,.4), 0 4px 14px rgba(30,140,220,.18);
    animation: rise var(--d) linear var(--delay) infinite;
  }
  @keyframes rise { to { transform: translate(24px, -120vh); } }
  .scene {
    width: min(440px, 100%); position: relative; z-index: 1; text-align: center;
    padding: 22px 18px 23px; border-radius: 34px;
    background: linear-gradient(180deg, rgba(255,255,255,.5), rgba(255,255,255,.22) 28%, rgba(255,255,255,.36));
    -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4);
    border: 1px solid rgba(255,255,255,.88);
    box-shadow: 0 28px 58px -24px rgba(8,80,140,.48), 0 0 0 5px rgba(255,255,255,.18),
      inset 0 1px 0 #fff, inset 0 -3px 12px rgba(30,140,220,.16);
  }
  .bowl-wrap { width: min(330px, 88vw); margin: 0 auto; position: relative; }
  .bowl { display: block; width: 100%; height: auto; overflow: visible; filter: drop-shadow(0 18px 18px rgba(0,92,145,.18)); }
  .food { opacity: 0; }
  .food.drop { animation: food-drop .9s ease-in forwards; }
  @keyframes food-drop { 0% { opacity: 0; transform: translateY(-24px); } 20% { opacity: 1; } 100% { opacity: 0; transform: translateY(36px); } }
  button {
    font: inherit; font-weight: 800; color: white; cursor: pointer;
    border: 1px solid rgba(255,255,255,.8); border-radius: 999px; padding: 12px 30px;
    background: var(--gloss), linear-gradient(180deg, #43c6f4, #0786c7);
    box-shadow: 0 8px 17px -8px rgba(0,91,155,.7), inset 0 1px 0 rgba(255,255,255,.8);
    text-shadow: 0 1px 2px rgba(0,48,90,.35); transition: transform .12s, filter .15s;
  }
  button:hover { filter: brightness(1.07); }
  button:active { transform: translateY(1px); }
  button + button { margin-left: 8px; }
  .details { margin-top: 14px; font-size: .9rem; line-height: 1.65; font-weight: 700; }
  .birth { color: var(--ink-soft); font-size: .8rem; font-weight: 600; }
  .message { min-height: 1.5em; color: var(--ink-soft); font-size: .83rem; margin-top: 4px; }
  .dead .water { fill: #a9dce9; }
  .dead .scene { filter: saturate(.68); }
  .dead-message { color: #6b7780; }
  @media (max-width: 420px) {
    body { padding: 12px; }
    .scene { padding: 18px 12px; border-radius: 28px; }
    .bowl-wrap { width: min(300px, 85vw); }
  }
  @media (prefers-reduced-motion: reduce) {
    .bubble, .food { animation: none !important; }
    button { transition: none; }
  }
</style>
</head>
<body>
<div class="sky" aria-hidden="true">
  <div class="sun"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
  <div class="hill h1"></div><div class="hill h2"></div>
  <span class="bubble" style="--x:7%;--s:34px;--d:26s;--delay:-4s"></span>
  <span class="bubble" style="--x:19%;--s:18px;--d:19s;--delay:-12s"></span>
  <span class="bubble" style="--x:34%;--s:46px;--d:32s;--delay:-20s"></span>
  <span class="bubble" style="--x:58%;--s:24px;--d:22s;--delay:-8s"></span>
  <span class="bubble" style="--x:72%;--s:40px;--d:30s;--delay:-16s"></span>
  <span class="bubble" style="--x:90%;--s:23px;--d:21s;--delay:-2s"></span>
</div>

<main class="scene" id="scene">
  <div class="bowl-wrap">
    <svg class="bowl" viewBox="0 0 360 320" role="img" aria-label="A goldfish swimming in a round glass fishbowl">
      <defs>
        <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fff" stop-opacity=".72"/>
          <stop offset=".35" stop-color="#bff2ff" stop-opacity=".18"/>
          <stop offset=".72" stop-color="#51c7ef" stop-opacity=".13"/>
          <stop offset="1" stop-color="#fff" stop-opacity=".48"/>
        </linearGradient>
        <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#9cecff" stop-opacity=".45"/>
          <stop offset="1" stop-color="#27b9eb" stop-opacity=".28"/>
        </linearGradient>
        <clipPath id="bowlClip"><path d="M42 68 C42 37 276 37 318 68 L302 210 C296 266 246 291 180 291 C114 291 64 266 58 210 Z"/></clipPath>
      </defs>
      <ellipse cx="180" cy="293" rx="113" ry="12" fill="#0879b5" opacity=".12"/>
      <g clip-path="url(#bowlClip)">
        <rect x="40" y="52" width="280" height="250" fill="url(#water)" class="water"/>
        <path d="M48 91 Q80 85 112 91 T176 91 T240 91 T312 91" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2"/>
        <g id="fish">
          <image href="goldfish.png" x="-70" y="-45" width="140" height="90" preserveAspectRatio="xMidYMid meet"/>
        </g>
        <g id="food" class="food" fill="#8d6235">
          <circle cx="154" cy="106" r="3"/><circle cx="168" cy="113" r="2.5"/><circle cx="180" cy="104" r="2.5"/>
        </g>
        <g fill="#fff" opacity=".7"><circle cx="94" cy="188" r="3"/><circle cx="105" cy="170" r="1.8"/><circle cx="257" cy="142" r="2.4"/><circle cx="239" cy="213" r="3.2"/></g>
      </g>
      <path d="M42 68 C42 37 276 37 318 68 L302 210 C296 266 246 291 180 291 C114 291 64 266 58 210 Z" fill="url(#glass)" stroke="#fff" stroke-opacity=".92" stroke-width="3"/>
      <path d="M42 68 C76 47 279 48 318 68" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".95"/>
      <path d="M53 82 Q49 150 69 213" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".7"/>
      <path d="M66 91 Q66 135 75 157" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity=".8"/>
      <path d="M305 94 Q300 151 288 182" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".6"/>
      <ellipse cx="180" cy="289" rx="77" ry="5" fill="#fff" opacity=".5"/>
    </svg>
  </div>
  <button id="feedButton" type="button">feed fish</button>
  <button id="newButton" type="button" hidden>get a new fish</button>
  <div class="details">
    <div id="lifespan">alive for 0 days, 0 hours, 0 minutes</div>
    <div class="birth" id="birth"></div>
    <div class="birth" id="lastFed"></div>
    <div class="message" id="message" aria-live="polite"></div>
  </div>
</main>

<script>
(() => {
  "use strict";

  // 48 hours without food means the fish has died.
  const SURVIVAL_MS = 48 * 60 * 60 * 1000;
  const STORAGE_KEY = "littleFishLife";
  const COOKIE_NAME = "littleFishLife";
  const COOKIE_MAX_AGE = 60 * 60 * 24 * 365 * 5;

  const scene = document.getElementById("scene");
  const fish = document.getElementById("fish");
  const food = document.getElementById("food");
  const feedButton = document.getElementById("feedButton");
  const newButton = document.getElementById("newButton");
  const lifespan = document.getElementById("lifespan");
  const birth = document.getElementById("birth");
  const lastFed = document.getElementById("lastFed");
  const message = document.getElementById("message");

  // ---- Fish swimming state ----------------------------------------------
  // The PNG faces left. facing = 1 keeps original (swimming left),
  // facing = -1 flips horizontally (swimming right).
  let fishX = 0, fishY = 0;
  let targetX = 0, targetY = 0;
  let facing = 1;
  let rotation = 0;
  let isDead = false;
  let lastFrameTime = 0;
  let dwellUntil = 0;
  const SWIM_SPEED = 0.4;   // lower = slower, lazier drift
  const PAUSE_MIN = 500;    // ms pause at each waypoint
  const PAUSE_MAX = 2000;

  function pickTarget() {
    targetX = (Math.random() - 0.5) * 80;   // ±40 px
    targetY = (Math.random() - 0.5) * 56;   // ±28 px
  }
  pickTarget();

  function animateFish(now) {
    if (isDead) return;
    if (!lastFrameTime) lastFrameTime = now;
    const dt = Math.min((now - lastFrameTime) / 1000, 0.05);
    lastFrameTime = now;

    const prevX = fishX;
    // smooth exponential drift toward target (natural ease in/out)
    fishX += (targetX - fishX) * dt * SWIM_SPEED;
    fishY += (targetY - fishY) * dt * SWIM_SPEED;

    // flip based on actual horizontal motion
    const vx = fishX - prevX;
    if (Math.abs(vx) > 0.03) {
      facing = vx > 0 ? -1 : 1;
    }

    // subtle pitch based on vertical motion
    const vy = (targetY - fishY) * SWIM_SPEED;
    const tilt = Math.max(-8, Math.min(8, vy * 2));
    const targetRotation = -tilt * facing;
    rotation += (targetRotation - rotation) * Math.min(dt * 3, 0.5);

    // arrived → rest a moment, then pick a new destination
    if (Math.hypot(targetX - fishX, targetY - fishY) < 4 && now > dwellUntil) {
      pickTarget();
      dwellUntil = now + PAUSE_MIN + Math.random() * (PAUSE_MAX - PAUSE_MIN);
    }

    const cx = 180 + fishX;
    const cy = 170 + fishY;
    fish.setAttribute(
      "transform",
      `translate(${cx.toFixed(2)} ${cy.toFixed(2)}) rotate(${rotation.toFixed(2)}) scale(${facing} 1)`
    );

    requestAnimationFrame(animateFish);
  }

  function startSwimming() {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      fish.setAttribute("transform", "translate(180 170)");
      return;
    }
    requestAnimationFrame(animateFish);
  }

  // ---- Persistence -------------------------------------------------------
  function readSavedLife() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) return JSON.parse(saved);
    } catch (error) {
      // Some browser preview modes restrict localStorage; try cookies below.
    }
    const prefix = encodeURIComponent(COOKIE_NAME) + "=";
    const item = document.cookie.split("; ").find(row => row.startsWith(prefix));
    if (!item) return null;
    try { return JSON.parse(decodeURIComponent(item.slice(prefix.length))); }
    catch (error) { return null; }
  }

  function saveLife(data) {
    let savedLocally = false;
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      savedLocally = true;
    } catch (error) {
      // Fall back to a cookie if localStorage is unavailable.
    }
    const secure = location.protocol === "https:" ? "; Secure" : "";
    document.cookie = encodeURIComponent(COOKIE_NAME) + "=" +
      encodeURIComponent(JSON.stringify(data)) +
      "; Max-Age=" + COOKIE_MAX_AGE + "; Path=/; SameSite=Lax" + secure;
    return savedLocally;
  }

  // ---- Display helpers ---------------------------------------------------
  function formatDate(timestamp) {
    return new Intl.DateTimeFormat(undefined, {
      year: "numeric", month: "long", day: "numeric",
      hour: "2-digit", minute: "2-digit"
    }).format(new Date(timestamp));
  }

  function elapsedText(milliseconds) {
    const totalMinutes = Math.max(0, Math.floor(milliseconds / 60000));
    const days = Math.floor(totalMinutes / 1440);
    const hours = Math.floor((totalMinutes % 1440) / 60);
    const minutes = totalMinutes % 60;
    return `alive for ${days} ${days === 1 ? "day" : "days"}, ${hours} ${hours === 1 ? "hour" : "hours"}, ${minutes} ${minutes === 1 ? "minute" : "minutes"}`;
  }

  function updateLifespan() {
    const data = readSavedLife();
    if (!data || !Number.isFinite(data.bornAt)) return;
    lifespan.textContent = elapsedText(Date.now() - data.bornAt);
  }

  // ---- Death state -------------------------------------------------------
  function setDead() {
    isDead = true;
    scene.classList.add("dead");
    const cx = 180 + fishX;
    const cy = 170 + fishY;
    fish.setAttribute(
      "transform",
      `translate(${cx.toFixed(2)} ${cy.toFixed(2)}) rotate(180) scale(${facing} 1)`
    );
    feedButton.hidden = true;
    newButton.hidden = false;
    message.textContent = "you should have come back sooner.";
    message.classList.add("dead-message");
  }

  // ---- Boot --------------------------------------------------------------
  function initialize() {
    let data = readSavedLife();
    const now = Date.now();

    if (!data || !Number.isFinite(data.bornAt) || !Number.isFinite(data.fedAt)) {
      data = { bornAt: now, fedAt: now };
      saveLife(data);
    }

    birth.textContent = "born " + formatDate(data.bornAt);
    lastFed.textContent = "last fed " + formatDate(data.fedAt);

    if (now - data.fedAt >= SURVIVAL_MS) {
      setDead();
    } else {
      updateLifespan();
      window.setInterval(updateLifespan, 1000); // tick every second so minutes roll over
      startSwimming();
    }
  }

  feedButton.addEventListener("click", () => {
    const data = readSavedLife();
    if (!data || Date.now() - data.fedAt >= SURVIVAL_MS) {
      setDead();
      return;
    }
    data.fedAt = Date.now();
    saveLife(data);
    lastFed.textContent = "last fed " + formatDate(data.fedAt);
    food.classList.remove("drop");
    void food.getBoundingClientRect();
    food.classList.add("drop");
  });

  newButton.addEventListener("click", () => {
    saveLife({ bornAt: Date.now(), fedAt: Date.now() });
    location.reload();
  });

  initialize();
})();
</script>
</body>
</html>
